<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Charj — Legal</title>
<meta name="description" content="Privacy Policy and Terms of Service for Charj, the free EV charger finder for Tunisia." />
<style>
:root{--bg:#f5f7fa;--surface:#fff;--text:#0f172a;--muted:#64748b;
--border:#e2e8f0;--accent:#0BD8B6;--accent-dark:#042F2E;}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--surface:#1e293b;
--text:#f8fafc;--muted:#94a3b8;--border:#334155;}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Helvetica Neue",
sans-serif;background:var(--bg);color:var(--text);line-height:1.6;
padding:32px 20px 80px;transition:background .3s,color .3s}
main{max-width:760px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;
margin-bottom:24px;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.brand-dot{width:36px;height:36px;border-radius:10px;background:var(--accent);
display:flex;align-items:center;justify-content:center;color:var(--accent-dark);
font-weight:800;font-size:18px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.3px}
.lang{display:flex;gap:6px}
.lang a{padding:6px 12px;border-radius:999px;text-decoration:none;
font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--border)}
.lang a.active{background:var(--accent);color:var(--accent-dark);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--border);
border-radius:20px;padding:32px 30px 34px}
h1{font-size:30px;letter-spacing:-.6px;margin:0 0 8px;font-weight:800}
h2{font-size:18px;margin:28px 0 10px;font-weight:700}
h3{font-size:15px;margin:18px 0 6px;font-weight:600}
p,li{font-size:14.5px}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px;font-size:13px}
@media (prefers-color-scheme:dark){code{background:rgba(255,255,255,.08)}}
ul{padding-left:22px}
[dir=rtl] ul{padding-right:22px;padding-left:0}
.meta{color:var(--muted);font-size:12.5px;margin:10px 0 22px}
.doc-nav{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.doc-nav a{background:var(--surface);border:1px solid var(--border);
padding:10px 16px;border-radius:12px;text-decoration:none;color:var(--text);
font-weight:600;font-size:13.5px}
footer{max-width:760px;margin:28px auto 0;color:var(--muted);font-size:12px;
text-align:center}
</style>
</head>
<body>
  <main>
    <div class="topbar">
      <a class="brand" href="./index.html">
        <span class="brand-dot">⚡</span>
        <span class="brand-name">Charj</span>
      </a>
    </div>
    <article class="card">
      <h1>Charj · Legal</h1>
      <p class="meta">Privacy Policy &amp; Terms of Service for the Charj mobile app.</p>
      <h2>Privacy Policy · Politique de confidentialité · سياسة الخصوصية</h2>
<div class="doc-nav"><a href="./privacy-en.html">English</a><a href="./privacy-fr.html">Français</a><a href="./privacy-ar.html">العربية</a></div>
<h2>Terms of Service · Conditions d'utilisation · شروط الاستخدام</h2>
<div class="doc-nav"><a href="./terms-en.html">English</a><a href="./terms-fr.html">Français</a><a href="./terms-ar.html">العربية</a></div>
    </article>
    <footer>
      Charj · <a href="https://github.com/alabenkhlifa/CharJ">github.com/alabenkhlifa/CharJ</a>
    </footer>
  </main>
</body>
</html>
