<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://sblkoeronfuhqklvnhtn.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Charj</title>
  <link rel="stylesheet" href="share.css">
  <script src="share.js" defer></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Charj">Charj<span aria-hidden="true">↗</span></a>
      <select id="language" aria-label="Langue / اللغة / Language">
        <option value="fr">Français</option><option value="ar">العربية</option><option value="en">English</option>
      </select>
    </header>
    <section class="intro">
      <p class="eyebrow" data-text="eyebrow"></p>
      <h1 data-text="title"></h1>
      <p class="muted" data-text="intro"></p>
    </section>
    <section id="status" class="status" aria-live="polite">
      <p id="status-text"></p>
      <button id="retry" type="button" hidden data-text="retry"></button>
    </section>
    <article id="itinerary" class="itinerary" hidden>
      <div class="trip-heading"><span class="route-icon" aria-hidden="true">↗</span><div><p class="eyebrow" data-text="destination"></p><h2 id="trip-title"></h2><p id="destination-name" class="muted"></p></div></div>
      <p class="meta" id="dates"></p>
      <h3 data-text="stops"></h3>
      <ol id="stops"></ol>
      <p class="notice" data-text="disclaimer"></p>
      <a id="open-app" class="button primary" data-text="open"></a>
      <p class="small muted" data-text="openHint"></p>
    </article>
    <section class="install">
      <div><h2 data-text="installTitle"></h2><p class="muted" data-text="installBody"></p></div>
      <div class="install-links"><a class="button secondary" href="https://apps.apple.com/app/id6770287451" data-text="ios" rel="noreferrer"></a><a class="button secondary" href="https://play.google.com/store/apps/details?id=tn.charj" data-text="android" rel="noreferrer"></a></div>
    </section>
    <footer><a id="privacy" href="privacy-fr.html" data-text="privacy"></a><span data-text="noTracking"></span></footer>
  </main>
</body>
</html>
